name: CI:Checks - Build, Type-Check and Validate

# Runs on every PR (and on main) so problems show up before merging; the labelled
# CI:Build / CI:Deploy workflows only run after a merge.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/aws/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the production compose file
        working-directory: deploy/aws
        run: |
          printf "DOMAIN=example.com\nADMIN_TOKEN=x\n" > .env
          docker compose config --quiet
      - name: Shellcheck the deploy script
        run: shellcheck deploy/aws/deploy.sh
      - name: Validate the frontend nginx config
        # the image renders templates/*.template with envsubst, as in production, then nginx -t
        run: |
          docker run --rm \
            -v "$PWD/frontend/nginx.conf:/etc/nginx/templates/default.conf.template:ro" \
            -e BACKEND_HOST=backend -e BACKEND_RESOLVER=127.0.0.11 \
            nginx:alpine nginx -t
