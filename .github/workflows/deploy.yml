name: CI:Deploy - Build Pre-Mined Blockchain Image

on:
  pull_request:
    types: [closed]
  workflow_dispatch: # manual redeploy
  schedule:
    - cron: "0 3 * * *" # nightly: restore the pre-mined demo chain

permissions:
  id-token: write # AWS OIDC
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  DEMO_URL: https://blockchain101.founderexchange.co

jobs:
  deploy-premined:
    if: github.event_name != 'pull_request' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'CI:Deploy'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create .env file for backend
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          node -e "
            const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);
            // GitHub only masks the secret as stored (JSON lines); mask each line of the
            // decoded key too, so no later log output can show it.
            sa.private_key.split('\n').filter(Boolean).forEach(function (line) { console.log('::add-mask::' + line); });
            const key = sa.private_key.split('\n').join('\\n');
            const lines = [
              'BACKEND_API_URL=http://localhost:9001',
              'FIREBASE_TYPE=' + sa.type,
              'FIREBASE_PROJECT_ID=' + sa.project_id,
              'FIREBASE_PRIVATE_KEY_ID=' + sa.private_key_id,
              'FIREBASE_PRIVATE_KEY=\"' + key + '\"',
              'FIREBASE_CLIENT_EMAIL=' + sa.client_email,
              'FIREBASE_CLIENT_ID=' + sa.client_id,
              'FIREBASE_AUTH_URI=' + sa.auth_uri,
              'FIREBASE_TOKEN_URI=' + sa.token_uri,
              'FIREBASE_AUTH_PROVIDER_CERT_URL=' + sa.auth_provider_x509_cert_url,
              'FIREBASE_CLIENT_CERT_URL=' + sa.client_x509_cert_url,
              'FIREBASE_UNIVERSE_DOMAIN=' + (sa.universe_domain || 'googleapis.com'),
            ];
            require('fs').writeFileSync('backend/.env', lines.join('\n') + '\n');
            console.log('backend/.env written:', lines.length, 'lines');
          "
          echo "Variable count: $(grep -c '=' backend/.env)"

      - name: Start devnet
        run: docker compose up -d

      - name: Check devnet health
        run: |
          echo "Waiting for backend (up to 120s)..."
          timeout 120 bash -c 'until curl -sf http://localhost:9001/blockchain > /dev/null; do
            echo "  not ready, retrying in 3s..."
            sleep 3
          done'
          echo "Backend is ready!"

      - name: Show docker logs on failure
        if: failure()
        run: |
          echo "=== Container status ==="
          docker compose ps
          echo "=== Backend logs ==="
          docker compose logs backend --tail=60
          echo "=== .env variable names (no values) ==="
          # Names only: the private key spans several lines, and printing whole lines leaked it
          grep -oE '^[A-Z_][A-Z0-9_]*=' backend/.env | tr -d '='

      - name: Install script dependencies
        run: cd scripts && npm install

      - name: Clear existing blockchain data
        run: |
          curl -sf -X DELETE http://localhost:9001/blockchain || true
          docker compose restart backend
          echo "Waiting for backend after restart (up to 60s)..."
          timeout 60 bash -c 'until curl -sf http://localhost:9001/blockchain > /dev/null; do sleep 2; done'
          echo "Backend ready!"

      - name: Populate devnet with pre-mined blockchain
        run: cd scripts && npm run populate

      - name: Verify blockchain state
        run: cd scripts && npm run verify

      - name: Stop devnet
        run: docker compose down

      - name: Build and push pre-mined backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/blockchain101-backend:pre-mined
            ${{ secrets.DOCKER_USERNAME }}/blockchain101-backend:pre-mined-${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/blockchain101-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/blockchain101-backend:latest
          cache-to: type=inline

      - name: Build and push pre-mined frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/blockchain101-frontend:pre-mined
            ${{ secrets.DOCKER_USERNAME }}/blockchain101-frontend:pre-mined-${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/blockchain101-frontend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/blockchain101-frontend:latest
          cache-to: type=inline

      - name: Test pre-mined images
        run: |
          docker compose up -d
          echo "Waiting for backend (up to 120s)..."
          timeout 120 bash -c 'until curl -sf http://localhost:9001/blockchain > /dev/null; do sleep 3; done'
          cd scripts && npm run verify
          cd .. && docker compose down

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Store Firebase credentials in SSM Parameter Store
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          aws ssm put-parameter --name /blockchain101/firebase-service-account \
            --type SecureString --overwrite --value "$FIREBASE_SERVICE_ACCOUNT_JSON" > /dev/null

      - name: Deploy to EC2 through SSM Run Command
        run: |
          CMD_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets Key=tag:Name,Values=blockchain101 \
            --comment "blockchain101 deploy ${{ github.sha }}" \
            --parameters 'commands=["GIT_REF=${{ github.event.pull_request.merge_commit_sha || github.sha }} /usr/local/bin/blockchain101-deploy"]' \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm list-command-invocations --command-id "$CMD_ID" \
              --query 'CommandInvocations[0].Status' --output text)
            echo "  status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                aws ssm list-command-invocations --command-id "$CMD_ID" --details \
                  --query 'CommandInvocations[0].CommandPlugins[0].Output' --output text
                exit 1 ;;
            esac
            sleep 5
          done
          [ "$STATUS" = "Success" ] || { echo "Deploy did not finish in time"; exit 1; }

      - name: Smoke test the live demo
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$DEMO_URL/api/difficulty" > /dev/null; then echo "Live: $DEMO_URL"; exit 0; fi
            sleep 5
          done
          echo "Demo did not respond at $DEMO_URL"; exit 1

      - name: Output summary
        run: |
          echo "## Pre-Mined Blockchain Images Built Successfully! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images pushed to Docker Hub:" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ secrets.DOCKER_USERNAME }}/blockchain101-backend:pre-mined\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ secrets.DOCKER_USERNAME }}/blockchain101-frontend:pre-mined\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Live demo: $DEMO_URL" >> $GITHUB_STEP_SUMMARY
