server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        resolver ${BACKEND_RESOLVER} valid=10s ipv6=off;
        set $upstream http://${BACKEND_HOST}:9001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Keep the visitor's IP (added by Caddy in production) for the backend's rate limits
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Server-Sent Events (/api/mining-progress): no buffering, long-lived connection
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Revalidate the page on every visit, so returning visitors get a deploy right away
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The bundle's name changes with its content, so it can be cached for good
    location ~* ^/bundle\.[0-9a-f]+\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript;
    gzip_disable "MSIE [1-6]\.";
}
