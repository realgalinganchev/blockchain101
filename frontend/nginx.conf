# Cache policy by path: the page revalidates on every visit, so returning visitors get a
# deploy right away; bundles are named by content hash, so they can be cached for good.
# Everything else (static assets, /api) sends no Cache-Control from nginx.
map $uri $cache_control {
    /index.html                     "no-cache";
    "~^/bundle\.[0-9a-f]+\.js$"     "public, max-age=31536000, immutable";
    default                         "";
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers on every response. The app loads only its own bundle, Google Fonts,
    # and same-origin API/SSE calls; style-loader injects <style> tags, hence
    # 'unsafe-inline' for styles (scripts stay 'self' only). HSTS is set by Caddy, which
    # terminates HTTPS in production.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control $cache_control;

    location /api/ {
        resolver ${BACKEND_RESOLVER} valid=10s ipv6=off;
        set $upstream http://${BACKEND_HOST}:9001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Keep the visitor's IP (added by Caddy in production) for the backend's rate limits
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Server-Sent Events (/api/mining-progress): no buffering, long-lived connection
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript;
    gzip_disable "MSIE [1-6]\.";
}
